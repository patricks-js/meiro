name: Sync Upstream

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.repository_owner == 'patricks-js'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync with upstream/master and check for new version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/elianiva/meiro.git
          else
            git remote add upstream https://github.com/elianiva/meiro.git
          fi
          git fetch upstream master

          ahead="$(git rev-list --count HEAD..upstream/master)"
          echo "Commits ahead in upstream/master: $ahead"

          if [ "$ahead" -gt 0 ]; then
            if ! git merge --no-edit upstream/master; then
              git merge --abort || true
              title="[sync] Conflito ao sincronizar com upstream/master"
              existing="$(gh issue list --state open --search "$title in:title" --json number --jq 'length')"
              if [ "$existing" -eq 0 ]; then
                gh issue create \
                  --title "$title" \
                  --body "O sync automático com \`elianiva/meiro\` encontrou conflitos de merge. Resolva localmente (\`git fetch upstream && git merge upstream/master\`) e dê push na \`master\`."
              fi
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git push origin HEAD:master
          fi

          sha="$(git rev-parse HEAD)"
          version="$(jq -r .version mygo.json)"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $tag does not exist yet; triggering Fork Release at $sha."
            {
              echo "should_release=true"
              echo "tag=$tag"
              echo "sha=$sha"
            } >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: sync
    if: needs.sync.outputs.should_release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/fork-release.yml
    with:
      tag: ${{ needs.sync.outputs.tag }}
      ref: ${{ needs.sync.outputs.sha }}
    secrets: inherit
